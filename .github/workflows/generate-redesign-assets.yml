name: Generate redesign assets

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate_redesign_assets.py'
      - '.github/workflows/generate-redesign-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate PNG assets
        run: python tools/generate_redesign_assets.py
      - name: Validate assets
        run: |
          python - <<'PY'
          from PIL import Image
          expected = {
            'hero.png': ((1792,1024), False),
            'leer.png': ((1024,1024), True),
            'kino.png': ((1024,1024), True),
            'interesse-wissen.png': ((1024,1024), True),
            'interesse-tiere.png': ((1024,1024), True),
            'interesse-magie.png': ((1024,1024), True),
            'interesse-abenteuer.png': ((1024,1024), True),
            'interesse-lachen.png': ((1024,1024), True),
            'interesse-musik.png': ((1024,1024), True),
          }
          for p,(size,alpha) in expected.items():
              im=Image.open(p)
              assert im.size == size, (p, im.size)
              assert ('A' in im.mode) == alpha, (p, im.mode)
              print(p, im.size, im.mode)
          PY
      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hero.png leer.png kino.png interesse-wissen.png interesse-tiere.png interesse-magie.png interesse-abenteuer.png interesse-lachen.png interesse-musik.png
          git diff --cached --quiet && exit 0
          git commit -m 'assets: add redesign illustrations'
          git push
